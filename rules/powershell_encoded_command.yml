title: PowerShell Encoded Command Execution
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: stable
description: >
  Detects execution of PowerShell with Base64 encoded commands,
  a common technique used by malware to obfuscate payloads.
author: commitdot
date: 2025/01/15
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1059.001
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -e '
  condition: selection
falsepositives:
  - Some legitimate admin scripts
  - SCCM deployments
level: medium
fields:
  - CommandLine
  - ParentImage
  - User
  - ComputerName
